  int32 dataInt32 = 1;
  int64 dataInt64 = 2;
  float dataFloat32 = 3;
  double dataFloat64 = 4;
  string dataString = 5;
  bytes dataWideString = 6;
  XYZ_StructFloat32 dataFloat32XYZ = 7;
  XYZ_StructFloat64 dataFloat64XYZ = 8;
  QuadInt32 dataQuadInt32 = 9;
  QuadFloat32 dataQuadFloat32 = 10;
  QuadFloat64 dataQuadFloat64 = 11;
}

message EventData {
  repeated EventField eventField = 1;
}

message EventInfo {
  uint32 eventKey = 1;
